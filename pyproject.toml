[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gharc"
dynamic = ["version"]
description = "A stream-processing tool for GitHub Archive data filtering."
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Arav Panwar", email = "aravpanwar@outlook.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.28.0",
    "click>=8.0.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",  # For Parquet support
    "tqdm>=4.65.0",     # For progress bars
]

[project.urls]
"Homepage" = "https://github.com/aravpanwar/gharc"
"Bug Tracker" = "https://github.com/aravpanwar/gharc/issues"

[project.scripts]
gharc = "gharc.cli:main"

[project.optional-dependencies]
fast = ["orjson>=3.9.0"]
test = ["pytest>=7.0"]

[tool.setuptools_scm]
fallback_version = "0.1.0"
